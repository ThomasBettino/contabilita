# Realizza le idee di Ada: un problema con l'etichetta "idea-ada" che contiene @claude
# (oppure un commento con @claude) fa partire Claude, che prepara la modifica.
# La modifica entra solo se la rivede e la approva una persona.
#
# Serve, una volta: il segreto ANTHROPIC_API_KEY nelle impostazioni del repository
# (Settings > Secrets and variables > Actions) e l'app Claude installata sul repository.
name: Claude Code

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude:
    # I problemi partono solo se hanno l'etichetta di Ada; i commenti solo se citano @claude.
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'idea-ada')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
